<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملف العامل - إعمار</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-body" id="bodyRoot">

  <div class="sidebar">
    <div class="logo"><img src="assets/logo.jpg" onerror="this.style.display='none'"> إعمار</div>
    <a href="dashboard.html"><i class="ph ph-squares-four"></i> لوحة القيادة</a> <!-- CHANGED TO dashboard.html -->
    <a href="projects.html"><i class="ph ph-folder-open"></i> مجلد المشاريع</a>
    <a href="fill_info.html"><i class="ph ph-users"></i> الفريق والإعدادات</a>
    <a href="board.html" class="active"><i class="ph ph-kanban"></i> لوحة المهام (Board)</a>
    <a href="tasks.html"><i class="ph ph-list-dashes"></i> قائمة المهام</a>
    <a href="report.html"><i class="ph ph-robot"></i> تقرير الذكاء الاصطناعي</a>
    <a href="settings.html" style="margin-top: auto; background: rgba(0,0,0,0.2);"><i class="ph ph-gear"></i> الإعدادات</a>
    <a href="#" onclick="handleLogout(event)" style="color: #ef4444;"><i class="ph ph-sign-out"></i> تسجيل الخروج</a>
  </div>
  
  <div class="main-content">
    <button onclick="window.location.href='fill_info.html'" style="background: var(--bg); color: var(--text-main); border: 1px solid var(--border); margin-bottom: 20px;"><i class="ph ph-arrow-right"></i> العودة للفريق</button>
    
    <div id="profileContent">
      <p>جاري تحميل البيانات...</p>
    </div>
  </div>

  <script src="sounds.js"></script>
  <script src="settings.js"></script>
  
  <script type="module">
    import { db, auth } from './firebase-config.js';
    import Saves from './saves.js';
    import { collection, getDocs, addDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
    import { getApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js';
    const storage = getStorage(getApp());
    import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    const ADMIN_EMAILS = ['hazemyt55@gmail.com','m.salama@emaar.gulf'];
    const safe = value => String(value ?? '').replace(/[&<>"\']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    window.handleLogout = async e => { e.preventDefault(); await signOut(auth); location.href='index.html'; };
    onAuthStateChanged(auth, user => {
      if (!user) { location.href='index.html'; return; }
      if (!user.emailVerified || !ADMIN_EMAILS.includes((user.email || '').toLowerCase())) {
        document.getElementById('profileContent').textContent='غير مصرح بالدخول إلى ملفات الإدارة.'; return;
      }
      loadProfile();
    });

    async function loadProfile() {
      const urlParams = new URLSearchParams(window.location.search);
      const workerId = urlParams.get('id');

      if (!workerId) {
        document.getElementById('profileContent').innerHTML = '<h2>خطأ: لم يتم تحديد العامل.</h2>';
        return;
      }

      const workers = await Saves.getWorkers();
      const tasks = await Saves.getTasks();
      const projects = await Saves.getProjects();
      const historySnap = await getDocs(collection(db, 'worker_history')).catch(() => ({ docs: [] }));
      
      const worker = workers.find(w => w.id === workerId);

      if (!worker) {
        document.getElementById('profileContent').innerHTML = '<h2>خطأ: العامل غير موجود.</h2>';
        return;
      }

      // Find all tasks assigned to this worker
      const myTasks = tasks.filter(t => {
          const isInArray = t.workerIds && t.workerIds.includes(workerId);
          const isOldFormat = t.workerId === workerId;
          const isReviewer = t.reviewerId === workerId;
          return isInArray || isOldFormat || isReviewer;
      });

      const todoTasks = myTasks.filter(t => t.status === 'pending');
      const doneTasks = myTasks.filter(t => t.status === 'done');
      const activeTasks = myTasks.filter(t => t.status === 'in_progress');
      const reviewTasks = myTasks.filter(t => t.status === 'review');
      const percent = myTasks.length ? Math.round(doneTasks.length / myTasks.length * 100) : 0;
      const history = historySnap.docs.map(d => ({id:d.id,...d.data()})).filter(e => e.workerId === workerId).sort((a,b) => Number(b.createdAt||0)-Number(a.createdAt||0));
      const assignedProjectIds = Array.isArray(worker.projectIds) ? worker.projectIds : (worker.projectId ? [worker.projectId] : []);
      const assignedProjects = projects.filter(project => assignedProjectIds.includes(project.id));
      const projectOptions = projects.map(project => '<option value="' + safe(project.id) + '" ' + (assignedProjectIds.includes(project.id) ? 'selected' : '') + '>' + safe(project.name || 'مشروع بدون اسم') + '</option>').join('');
      const photoURL = [worker.photoURL,worker.photoUrl,worker.avatarUrl,worker.photo].find(value => typeof value === 'string' && /^https:\/\//i.test(value)) || '';
      const fmt = value => { if(!value) return 'غير مسجل'; const d=value?.toDate?value.toDate():new Date(value); return Number.isNaN(d.getTime())?'غير مسجل':d.toLocaleDateString('ar-SA'); };

      // Render the clean profile view with updated titles
      document.getElementById('profileContent').innerHTML = `
        <div class="card" style="display: flex; align-items: center; gap: 20px; background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white;">
          <div style="width: 88px; height: 88px; flex:0 0 88px; background: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; overflow:hidden; font-size: 40px; color: var(--primary);">
            ${photoURL ? '<img src="' + safe(photoURL) + '" alt="الصورة الشخصية" style="width:100%;height:100%;object-fit:cover">' : '<i class="ph ph-user"></i>'}
          </div>
          <div>
            <h1 style="margin: 0; color: white !important;">${safe(worker.name)}</h1>
            <p style="margin: 5px 0 0 0; color: white !important; opacity: 0.9;">${safe(worker.role || 'عامل')} | ${safe(worker.phone || 'لا يوجد رقم')}</p>
          </div>
        </div>

        <div class="card" style="margin-top:20px"><h2>نسبة الإنجاز: ${percent}%</h2><div style="height:10px;background:var(--border);border-radius:20px;overflow:hidden"><div style="height:100%;width:${percent}%;background:var(--success)"></div></div><p>إجمالي ${myTasks.length} · مكتمل ${doneTasks.length} · تنفيذ ${activeTasks.length} · مراجعة ${reviewTasks.length} · انتظار ${todoTasks.length}</p></div>
        <div class="card"><h2>البيانات المهنية والشخصية</h2><div class="grid-3"><div>القسم: ${safe(worker.department || 'غير مسجل')}</div><div>التخصص: ${safe(worker.specialty || 'غير مسجل')}</div><div>الجنسية: ${safe(worker.nationality || 'غير مسجل')}</div><div style="grid-column:1/-1">المشاريع: ${assignedProjects.length ? assignedProjects.map(project=>safe(project.name || 'مشروع')).join('، ') : 'لا توجد مشاريع مرتبطة'}</div></div></div>
        <div class="card"><h2>البيانات الوظيفية والتواريخ</h2><div class="grid-3"><div>الميلاد: ${fmt(worker.birthDate)}</div><div>التعيين: ${fmt(worker.hireDate)}</div><div>بداية العقد: ${fmt(worker.contractStartDate)}</div><div>نهاية العقد: ${fmt(worker.contractEndDate)}</div><div>آخر ترقية: ${fmt(worker.promotionDate)}</div><div>آخر تقييم: ${fmt(worker.lastEvaluationDate)}</div><div>آخر تحديث: ${fmt(worker.updatedAt)}</div></div></div>
        <div class="card"><h2>تحديث بيانات الملف (الإدارة)</h2><form id="adminWorkerForm"><div class="grid-3"><div class="form-group"><label>الاسم</label><input id="adminName" value="${safe(worker.name || '')}" required></div><div class="form-group"><label>المسمى</label><input id="adminRole" value="${safe(worker.role || '')}"></div><div class="form-group"><label>الهاتف</label><input id="adminPhone" value="${safe(worker.phone || '')}"></div>${[['birthDate','تاريخ الميلاد'],['hireDate','تاريخ التعيين'],['contractStartDate','بداية العقد'],['contractEndDate','نهاية العقد'],['promotionDate','تاريخ الترقية'],['lastEvaluationDate','آخر تقييم']].map(([id,label])=>`<div class="form-group"><label>${label}</label><input type="date" id="${id}" value="${safe(worker[id] || '')}"></div>`).join('')}
        <div class="form-group"><label for="adminDepartment">القسم</label><input id="adminDepartment" maxlength="100" value="${safe(worker.department || '')}" placeholder="مثال: المشاريع"></div>
        <div class="form-group"><label for="adminSpecialty">التخصص</label><input id="adminSpecialty" maxlength="120" value="${safe(worker.specialty || '')}" placeholder="مثال: هندسة مدنية"></div>
        <div class="form-group"><label for="adminNationality">الجنسية</label><input id="adminNationality" maxlength="80" value="${safe(worker.nationality || '')}"></div>
        <div class="form-group"><label for="adminProjects">المشاريع المرتبطة</label><select id="adminProjects" multiple size="4" style="width:100%;min-height:110px">${projectOptions}</select><small>استخدم Ctrl أو Command لاختيار أكثر من مشروع.</small></div>
        <div class="form-group"><label for="adminPhoto">الصورة الشخصية</label><input id="adminPhoto" type="file" accept="image/*"><small>الصورة تُرفع إلى Firebase Storage، ثم يُحفظ رابطها في ملف المهندس.</small><div id="photoUploadStatus" role="status"></div></div>
        </div><button type="submit">حفظ البيانات</button></form></div>
        <div class="card"><h2>إضافة حدث تاريخي</h2><form id="historyForm"><div class="form-group"><label>عنوان الحدث</label><input id="historyTitle" required maxlength="100"></div><div class="form-group"><label>الوصف</label><textarea id="historyDescription" required maxlength="1000"></textarea></div><button type="submit">إضافة للسجل</button></form><h3>السجل الزمني</h3>${history.length ? history.map(e=>`<div style="padding:10px;border-right:3px solid var(--primary);margin:10px 0;background:var(--bg)"><strong>${safe(e.title)}</strong><p>${safe(e.description)}</p><small>${fmt(e.createdAt)} · ${safe(e.updatedByEmail || 'الإدارة')}</small></div>`).join('') : '<p>لا توجد أحداث مسجلة.</p>'}</div>
        <div class="grid-3" style="margin-top: 20px;">
          <!-- Column 1: Pending -->
          <div class="card">
            <h3 style="color: var(--text-main); border-bottom: 2px solid var(--border); padding-bottom: 10px;">
              <i class="ph ph-hourglass"></i> هام (${todoTasks.length})
            </h3>
            <ul style="list-style: none; padding: 0; margin-top: 15px;">
              ${todoTasks.length === 0 ? '<li style="color: var(--text-muted);">لا يوجد</li>' : todoTasks.map(t => `<li style="padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px;">${t.title}</li>`).join('')}
            </ul>
          </div>

          <!-- Column 2: Active -->
          <div class="card">
            <h3 style="color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 10px;">
              <i class="ph ph-spinner"></i> جاري العمل (${activeTasks.length})
            </h3>
            <ul style="list-style: none; padding: 0; margin-top: 15px;">
              ${activeTasks.length === 0 ? '<li style="color: var(--text-muted);">لا يوجد</li>' : activeTasks.map(t => `<li style="padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px;">${t.title}</li>`).join('')}
            </ul>
          </div>

          <!-- Column 3: Done -->
          <div class="card">
            <h3 style="color: var(--success); border-bottom: 2px solid var(--success); padding-bottom: 10px;">
              <i class="ph ph-check-circle"></i> تم الانتهاء (${doneTasks.length})
            </h3>
            <ul style="list-style: none; padding: 0; margin-top: 15px;">
              ${doneTasks.length === 0 ? '<li style="color: var(--text-muted);">لا يوجد</li>' : doneTasks.map(t => `<li style="padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; text-decoration: line-through; color: var(--text-muted);">${t.title}</li>`).join('')}
            </ul>
          </div>
        </div>
      `;
      let pendingPhotoURL = photoURL;
      document.getElementById('adminPhoto').addEventListener('change', async event => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const status = document.getElementById('photoUploadStatus');
        if (!file.type.startsWith('image/')) { status.textContent = 'يرجى اختيار ملف صورة صالح.'; event.target.value=''; return; }
        if (file.size > 5 * 1024 * 1024) { status.textContent = 'حجم الصورة يجب ألا يتجاوز 5 ميجابايت.'; event.target.value=''; return; }
        status.textContent = 'جاري رفع الصورة...';
        try {
          const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
          const imageRef = storageRef(storage,'worker-profiles/' + workerId + '/' + Date.now() + '-' + safeName);
          const uploaded = await uploadBytes(imageRef,file,{contentType:file.type});
          pendingPhotoURL = await getDownloadURL(uploaded.ref);
          status.textContent = 'تم رفع الصورة. اضغط حفظ البيانات لاعتمادها في الملف.';
        } catch(uploadError) {
          console.error(uploadError);
          status.textContent = 'تعذر رفع الصورة. تحقق من صلاحيات Firebase Storage.';
        }
      });
      document.getElementById('adminWorkerForm').addEventListener('submit', async e => {
        e.preventDefault(); const patch={name:document.getElementById('adminName').value.trim(),role:document.getElementById('adminRole').value.trim(),phone:document.getElementById('adminPhone').value.trim(),department:document.getElementById('adminDepartment').value.trim(),specialty:document.getElementById('adminSpecialty').value.trim(),nationality:document.getElementById('adminNationality').value.trim(),projectIds:Array.from(document.getElementById('adminProjects').selectedOptions).map(option=>option.value),photoURL:pendingPhotoURL || null,updatedAt:Date.now()};
        ['birthDate','hireDate','contractStartDate','contractEndDate','promotionDate','lastEvaluationDate'].forEach(k=>patch[k]=document.getElementById(k).value || null);
        try { await Saves.updateWorker(workerId,patch); await addDoc(collection(db,'worker_history'),{workerId,title:'تحديث البيانات الوظيفية',description:'تم تحديث بيانات الملف',createdAt:Date.now(),updatedByEmail:auth.currentUser.email}); alert('تم الحفظ'); loadProfile(); } catch(err){alert('تعذر الحفظ: '+err.message);}
      });
      document.getElementById('historyForm').addEventListener('submit', async e => { e.preventDefault(); try { await addDoc(collection(db,'worker_history'),{workerId,title:document.getElementById('historyTitle').value.trim(),description:document.getElementById('historyDescription').value.trim(),createdAt:Date.now(),updatedByEmail:auth.currentUser.email}); loadProfile(); } catch(err){alert('تعذر إضافة الحدث: '+err.message);} });
    }

  </script>
</body>
</html>
